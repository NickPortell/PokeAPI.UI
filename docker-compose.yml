services:
  nginx:
    image: nginx:latest
    ports:
      - "3000:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app_network
    depends_on:
      - backend
      - frontend

  backend:
    container_name: backend
    image: ${DOCKER_REGISTRY-}battleapi
    build:
      context: ../PokeAPI/BattleAPI
      dockerfile: /Dockerfile
    ports:
    - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000;
    volumes:
    - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
    networks:
      - app_network

  frontend:
    container_name: frontend
    image: ${DOCKER_REGISTRY-}pokeapi-ui
    build:
      context: ../PokeAPI.UI
      dockerfile: /Dockerfile
    volumes:
    - .:/app
    - /app/node_modules
    networks:
      - app_network
    depends_on:
      - backend

networks:
  app_network:
     driver: bridge